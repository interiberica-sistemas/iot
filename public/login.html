<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IIWSS — Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg: #030b18;
      --cyan: #3df8ff;
      --magenta: #ff4fd8;
      --green: #65ff9b;
      --text: #ebf3ff;
      --muted: #8a9fc4;
      --card: rgba(10, 20, 45, 0.85);
      --border: rgba(61,248,255,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(61,248,255,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 10% 80%, rgba(255,79,216,0.1) 0%, transparent 70%),
        linear-gradient(160deg, #030b18 0%, #071428 50%, #0a0e22 100%);
      overflow: hidden;
    }

    /* Animated grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(61,248,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,248,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 48px 48px; }
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 1rem;
      animation: fadeUp 0.7s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 32px 80px rgba(0,0,0,0.5),
        0 0 60px rgba(61,248,255,0.06);
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .brand h1 {
      font-family: 'Orbitron', monospace;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(61,248,255,0.5);
      margin-bottom: 0.25rem;
    }
    .brand p { color: var(--muted); font-size: 0.82rem; }

    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }
    .field input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(61,248,255,0.15);
    }
    .field input::placeholder { color: rgba(255,255,255,0.3); }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.5rem;
      border: 1px solid rgba(61,248,255,0.5);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(61,248,255,0.18), rgba(255,79,216,0.15));
      color: var(--text);
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(61,248,255,0.35), 0 0 20px rgba(255,79,216,0.2);
    }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(255,93,159,0.15);
      border: 1px solid rgba(255,93,159,0.4);
      border-radius: 10px;
      padding: 0.6rem 0.9rem;
      font-size: 0.82rem;
      color: #ff8ab8;
      margin-top: 0.75rem;
      display: none;
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 1.5rem;
    }
    .hint code {
      background: rgba(255,255,255,0.08);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      color: var(--cyan);
    }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <img src="Img/logo.jpeg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1>IIWSS</h1>
      <p>Sistema de Monitoreo IoT</p>
    </div>

    <div class="field">
      <label>Usuario</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btnLogin" onclick="doLogin()">INGRESAR</button>
    <div class="error-msg" id="errorMsg">❌ Usuario o contraseña incorrectos</div>

    <p class="hint">Demo: <code>admin</code> / <code>admin123</code></p>
  </div>
</div>

<script>
  // Si ya tiene sesión activa (cookie), el servidor redirige automáticamente
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const btn      = document.getElementById('btnLogin');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) { showError('Completa todos los campos'); return; }

    btn.disabled    = true;
    btn.textContent = 'VERIFICANDO...';

    try {
      const res  = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch { showError('Respuesta inesperada: ' + text.slice(0, 80)); btn.disabled = false; btn.textContent = 'INGRESAR'; return; }

      if (!res.ok) throw new Error(data.error || 'Error');

      // Guarda datos del usuario en sessionStorage para mostrar nombre/rol
      sessionStorage.setItem('iot_user', JSON.stringify(data.user));
      // La cookie ya fue seteada por el servidor — solo redirige
      window.location.href = '/index.html';
    } catch (e) {
      showError(e.message || 'Error de conexión');
      btn.disabled    = false;
      btn.textContent = 'INGRESAR';
    }
  }

  function showError(msg) {
    const err = document.getElementById('errorMsg');
    err.textContent  = '❌ ' + msg;
    err.style.display = 'block';
  }
</script>
</body>
</html>
